name: Check and deploy site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || 'production-deployment' }}
  cancel-in-progress: false
jobs:
  # The page shows example programs with their output. This job checks that
  # the page has the current examples, and that aihc still prints that output.
  examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AIHC_VERSION: "0.2.0"
      AIHC_SHA256: 35d3745aa8fcc4322e3d9e369b765cc8190d0dc76df65d3dbe6819ee695cfa92
    steps:
      - uses: actions/checkout@v4

      - name: Check that the page has the current examples
        run: node scripts/examples.mjs --check

      # The live examples load the compiler from the web kit of one release.
      - name: Check the scripts and the web kit of the page
        run: |
          set -euo pipefail
          node --check public/highlight.mjs
          node --check public/playground.mjs
          kit="$(sed -n 's/^const KIT = "\(.*\)";$/\1/p' public/playground.mjs)"
          test -n "$kit"
          curl --fail --silent --show-error --output /dev/null "${kit}manifest.json"

      - name: Download aihc
        run: |
          set -euo pipefail
          archive="aihc-$AIHC_VERSION-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive" \
            "https://github.com/ai-haskell-compiler/aihc/releases/download/v$AIHC_VERSION/$archive"
          echo "$AIHC_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/$archive"
          echo "AIHC=$RUNNER_TEMP/aihc-$AIHC_VERSION-linux-amd64/aihc" >>"$GITHUB_ENV"

      - name: Run the examples
        run: scripts/run-examples.sh

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the Cloudflare deployment
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.143.0"
          command: deploy --dry-run

      - name: Deploy to aihc.app
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.143.0"
          command: deploy
